<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bozorcha — Hamma sotadi, hamma sotib oladi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-hover: #1a2642;
      --border: #243252;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* Rangli chiziq */
    .top-stripe {
      height: 5px;
      background: linear-gradient(90deg, #3b82f6, #10b981, #f59e0b, #ef4444, #8b5cf6);
    }

    /* Header */
    header {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Tugmalar */
    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }

    .btn-outline {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: var(--surface-hover);
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.3);
    }

    /* Hero & Main */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    .hero h1 {
      font-size: 2.3rem;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 14px;
      font-family: Georgia, serif;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 24px;
    }

    /* Filter & Search */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 10px 18px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      background: var(--text);
      color: var(--bg);
      border-color: var(--text);
    }

    .search-box {
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      margin-bottom: 28px;
      outline: none;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    /* E'lonlar ro'yxati */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      width: fit-content;
    }

    .badge-sell {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
    }

    .badge-buy {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
    }

    .card h3 {
      font-size: 1.15rem;
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      background: rgba(19, 28, 49, 0.4);
      border-radius: 16px;
      border: 1px dashed var(--border);
    }

    /* Modallar */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.4rem;
    }

    .close-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 0.98rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f59e0b;
    }

    .pwd-wrap {
      position: relative;
    }

    .pwd-wrap input {
      padding-right: 44px;
    }

    .eye-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1.15rem;
      cursor: pointer;
      padding: 4px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.9rem;
      margin-bottom: 14px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert.success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-footer .btn {
      flex: 1;
      padding: 12px;
    }

    .switch-mode {
      text-align: center;
      margin-top: 16px;
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .switch-mode button {
      background: none;
      border: none;
      color: #60a5fa;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <div class="top-stripe"></div>

  <header>
    <a href="#" class="logo">Bozorcha</a>
    <div class="nav-actions">
      <button id="btn_auth" class="btn btn-outline">Kirish</button>
      <button id="btn_logout" class="btn btn-danger" hidden>Chiqish</button>
      <button id="btn_new_ad" class="btn btn-primary">+ e'lon berish</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Hamma sotadi,<br>hamma sotib oladi</h1>
      <p>Tuflingiz ortiqchami yoki banan kerakmi? E'lon joylang — kerakli odam sizni topadi.</p>
    </section>

    <div class="tabs">
      <button class="tab active" data-type="sell">Sotuvda</button>
      <button class="tab" data-type="buy">Kerak (xaridor qidirmoqda)</button>
    </div>

    <input type="text" id="search_input" class="search-box" placeholder="Qidirish (masalan: banan)" />

    <div id="ads_container">
      <div class="empty-state">Hozircha e'lon yo'q. Birinchi bo'lib "+ e'lon berish" tugmasini bosing.</div>
    </div>
  </main>

  <!-- KIRISH / RO'YXATDAN O'TISH MODALI -->
  <div id="auth_modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="auth_title">Kirish</h2>
        <button type="button" class="close-icon" id="close_auth_x">&times;</button>
      </div>

      <div id="auth_msg" class="alert" hidden></div>

      <form id="auth_form">
        <div class="form-group">
          <label for="a_email">Email</label>
          <input id="a_email" type="email" required placeholder="email@gmail.com" autocomplete="email" />
        </div>

        <div class="form-group">
          <label for="a_pass">Parol (kamida 6 belgi)</label>
          <div class="pwd-wrap">
            <input id="a_pass" type="password" required minlength="6" autocomplete="current-password" />
            <button type="button" id="toggle_pass" class="eye-btn" aria-label="Parolni ko‘rsatish">👁️</button>
          </div>
        </div>

        <!-- Faqat ro'yxatdan o'tishda ko'rinadigan maydonlar -->
        <div class="form-group" id="group_cp" hidden>
          <label for="a_cp">Parolni takrorlang</label>
          <div class="pwd-wrap">
            <input id="a_cp" type="password" minlength="6" autocomplete="new-password" />
            <button type="button" id="toggle_cp" class="eye-btn" aria-label="Parolni ko‘rsatish">👁️</button>
          </div>
        </div>

        <div class="form-group" id="group_city" hidden>
          <label for="a_city">Shaharingiz</label>
          <select id="a_city">
            <option value="" disabled selected>Hududni tanlang...</option>
            <option value="Toshkent shahri">Toshkent shahri</option>
            <option value="Toshkent viloyati">Toshkent viloyati</option>
            <option value="Andijon viloyati">Andijon viloyati</option>
            <option value="Buxoro viloyati">Buxoro viloyati</option>
            <option value="Farg‘ona viloyati">Farg‘ona viloyati</option>
            <option value="Jizzax viloyati">Jizzax viloyati</option>
            <option value="Xorazm viloyati">Xorazm viloyati</option>
            <option value="Namangan viloyati">Namangan viloyati</option>
            <option value="Navoiy viloyati">Navoiy viloyati</option>
            <option value="Qashqadaryo viloyati">Qashqadaryo viloyati</option>
            <option value="Qoraqalpog‘iston Respublikasi">Qoraqalpog‘iston Respublikasi</option>
            <option value="Samarqand viloyati">Samarqand viloyati</option>
            <option value="Sirdaryo viloyati">Sirdaryo viloyati</option>
            <option value="Surxondaryo viloyati">Surxondaryo viloyati</option>
          </select>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn_close_auth" class="btn btn-outline">Yopish</button>
          <button type="submit" id="btn_submit_auth" class="btn btn-primary">Kirish</button>
        </div>

        <div class="switch-mode">
          <span id="switch_text">Hisobingiz yo‘qmi?</span>
          <button type="button" id="btn_switch_mode">Ro‘yxatdan o‘tish</button>
        </div>
      </form>
    </div>
  </div>

  <!-- E'LON BERISH MODALI -->
  <div id="ad_modal" class="modal-backdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>Yangi e'lon berish</h2>
        <button type="button" class="close-icon" id="close_ad_x">&times;</button>
      </div>

      <div id="ad_msg" class="alert" hidden></div>

      <form id="ad_form">
        <div class="form-group">
          <label for="ad_type">E'lon turi</label>
          <select id="ad_type" required>
            <option value="sell">Sotaman</option>
            <option value="buy">Sotib olaman (kerak)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="ad_title">Nomi</label>
          <input id="ad_title" type="text" required placeholder="Masalan: Banan yoki Sport tufli" />
        </div>

        <div class="form-group">
          <label for="ad_price">Narxi (so'm)</label>
          <input id="ad_price" type="text" required placeholder="Masalan: 25 000 so'm" />
        </div>

        <div class="form-group">
          <label for="ad_phone">Aloqa uchun telefon yoki Telegram</label>
          <input id="ad_phone" type="text" required placeholder="+998 90 123 45 67" />
        </div>

        <div class="form-group">
          <label for="ad_desc">Qo'shimcha ma'lumot</label>
          <textarea id="ad_desc" rows="3" placeholder="Holati, yetkazib berish va h.k."></textarea>
        </div>

        <div class="modal-footer">
          <button type="button" id="btn_close_ad" class="btn btn-outline">Bekor qilish</button>
          <button type="submit" class="btn btn-primary">Joylashtirish</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. SUPABASE SOZLAMALARI
    const SUPABASE_URL = "https://nlgknzjdwlkmpvwnnijt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_hRJB9yq_W9wtckXSjWIcjw___lNlXe0";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const $ = (id) => document.getElementById(id);

    let currentUser = null;
    let isRegisterMode = false;
    let pendingAdOpen = false;
    let currentTab = "sell";
    let allAds = [];

    // 2. FOYDALANUVCHI HOLATINI TEKSHIRISH
    async function checkUser() {
      const { data: { session } } = await sb.auth.getSession();
      currentUser = session ? session.user : null;
      updateHeaderUI();
    }

    function updateHeaderUI() {
      if (currentUser) {
        $("btn_auth").hidden = true;
        $("btn_logout").hidden = false;
      } else {
        $("btn_auth").hidden = false;
        $("btn_logout").hidden = true;
      }
    }

    // 3. PAROL KO'ZCHALARI (1-chi va 2-chi maydon uchun)
    function setupEyeToggle(btnId, inputId) {
      $(btnId).onclick = function () {
        const inp = $(inputId);
        const isPwd = inp.type === "password";
        inp.type = isPwd ? "text" : "password";
        $(btnId).textContent = isPwd ? "🙈" : "👁️";
      };
    }
    setupEyeToggle("toggle_pass", "a_pass");
    setupEyeToggle("toggle_cp", "a_cp");

    // 4. KIRISH / RO'YXATDAN O'TISH MODALI BOSHQARUVI
    function setAuthMode(register) {
      isRegisterMode = register;
      $("auth_msg").hidden = true;
      $("auth_title").textContent = register ? "Ro‘yxatdan o‘tish" : "Kirish";
      $("btn_submit_auth").textContent = register ? "Ro‘yxatdan o‘tish" : "Kirish";
      $("group_cp").hidden = !register;
      $("group_city").hidden = !register;
      $("a_cp").required = register;
      $("a_city").required = register;
      $("a_pass").autocomplete = register ? "new-password" : "current-password";

      $("switch_text").textContent = register ? "Allaqachon hisobingiz bormi?" : "Hisobingiz yo‘qmi?";
      $("btn_switch_mode").textContent = register ? "Kirish" : "Ro‘yxatdan o‘tish";
    }

    function openAuthModal(register = false) {
      $("auth_form").reset();
      $("a_pass").type = "password";
      $("a_cp").type = "password";
      $("toggle_pass").textContent = "👁️";
      $("toggle_cp").textContent = "👁️";
      setAuthMode(register);
      $("auth_modal").hidden = false;
    }

    function closeAuthModal() {
      $("auth_modal").hidden = true;
      pendingAdOpen = false;
    }

    function showAuthMsg(text, isSuccess = false) {
      const el = $("auth_msg");
      el.textContent = text;
      el.className = isSuccess ? "alert success" : "alert";
      el.hidden = false;
    }

    $("btn_auth").onclick = () => {
      pendingAdOpen = false;
      openAuthModal(false);
    };
    $("btn_close_auth").onclick = closeAuthModal;
    $("close_auth_x").onclick = closeAuthModal;
    $("btn_switch_mode").onclick = () => setAuthMode(!isRegisterMode);

    // Kirish yoki Ro'yxatdan o'tish yuborilganda
    $("auth_form").onsubmit = async (e) => {
      e.preventDefault();
      $("auth_msg").hidden = true;

      const email = $("a_email").value.trim();
      const password = $("a_pass").value;

      if (isRegisterMode) {
        const confirmPass = $("a_cp").value;
        const city = $("a_city").value;

        if (password !== confirmPass) {
          showAuthMsg("Parollar bir-biriga mos kelmadi!");
          return;
        }
        if (!city) {
          showAuthMsg("Iltimos, shahar yoki viloyatingizni tanlang!");
          return;
        }

        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: { data: { city: city } }
        });

        if (error) {
          showAuthMsg("Xatolik: " + error.message);
          return;
        }

        currentUser = data.user;
        updateHeaderUI();
        const shouldOpenAd = pendingAdOpen;
        closeAuthModal();
        if (shouldOpenAd) openAdModal();

      } else {
        // KIRISH QISMI
        const { data, error } = await sb.auth.signInWithPassword({ email, password });

        if (error) {
          showAuthMsg("Kirilmadi, ro‘yxatdan o‘ting");
          return;
        }

        currentUser = data.user;
        updateHeaderUI();
        const shouldOpenAd = pendingAdOpen;
        closeAuthModal();
        if (shouldOpenAd) openAdModal();
      }
    };

    // Chiqish
    $("btn_logout").onclick = async () => {
      await sb.auth.signOut();
      currentUser = null;
      updateHeaderUI();
    };

    // 5. E'LON BERISH MODALI VA TEKSHIRUVI
    function openAdModal() {
      $("ad_form").reset();
      $("ad_msg").hidden = true;
      $("ad_modal").hidden = false;
    }

    function closeAdModal() {
      $("ad_modal").hidden = true;
    }

    $("btn_new_ad").onclick = () => {
      if (!currentUser) {
        pendingAdOpen = true;
        openAuthModal(false);
        showAuthMsg("E'lon berish uchun avval tizimga kiring yoki ro‘yxatdan o‘ting.");
      } else {
        openAdModal();
      }
    };

    $("btn_close_ad").onclick = closeAdModal;
    $("close_ad_x").onclick = closeAdModal;

    $("ad_form").onsubmit = async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const newAd = {
        user_id: currentUser.id,
        city: currentUser.user_metadata?.city || "O'zbekiston",
        type: $("ad_type").value,
        title: $("ad_title").value.trim(),
        price: $("ad_price").value.trim(),
        phone: $("ad_phone").value.trim(),
        description: $("ad_desc").value.trim()
      };

      const { error } = await sb.from("ads").insert([newAd]);
      if (error) {
        $("ad_msg").textContent = "Saqlashda xatolik: " + error.message;
        $("ad_msg").hidden = false;
        return;
      }

      closeAdModal();
      loadAds();
    };

    // 6. E'LONLARNI YUKLASH VA QIDIRUV
    async function loadAds() {
      const { data, error } = await sb
        .from("ads")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        $("ads_container").innerHTML = `<div class="empty-state">Ma'lumotni o'qib bo'lmadi.</div>`;
        return;
      }

      allAds = data || [];
      renderAds();
    }

    function renderAds() {
      const q = $("search_input").value.toLowerCase().trim();
      const filtered = allAds.filter(ad =>
        ad.type === currentTab &&
        (ad.title.toLowerCase().includes(q) || (ad.description && ad.description.toLowerCase().includes(q)))
      );

      if (filtered.length === 0) {
        $("ads_container").innerHTML = `<div class="empty-state">Hozircha e'lon yo'q. Birinchi bo'lib "+ e'lon berish" tugmasini bosing.</div>`;
        return;
      }

      $("ads_container").innerHTML = `<div class="grid">` + filtered.map(ad => `
        <div class="card">
          <div>
            <span class="badge ${ad.type === 'sell' ? 'badge-sell' : 'badge-buy'}">
              ${ad.type === 'sell' ? 'Sotiladi' : 'Kerak'}
            </span>
            <h3 style="margin-top:8px">${escapeHtml(ad.title)}</h3>
            <p style="color:var(--text-muted);font-size:0.9rem;margin-top:4px">${escapeHtml(ad.description || "")}</p>
          </div>
          <div>
            <div class="card-price">${escapeHtml(ad.price)}</div>
            <div class="card-meta">
              <span>📍 ${escapeHtml(ad.city || "O'zbekiston")}</span>
              <span>📞 ${escapeHtml(ad.phone)}</span>
            </div>
          </div>
        </div>
      `).join("") + `</div>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    document.querySelectorAll(".tab").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.type;
        renderAds();
      };
    });

    $("search_input").oninput = renderAds;

    // Ishga tushirish
    checkUser();
    loadAds();
  </script>
</body>
</html>
